<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamilore ❤️</title>

<style>
body{
margin:0;
font-family:Segoe UI,Arial;
text-align:center;
color:white;
background:linear-gradient(to top,#2b1055,#7597de,#ffb6c1);
overflow-x:hidden;
}

/* ENTRANCE */
#entrance{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("torii.jpg") center/cover no-repeat;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

/* TREE */
#treeContainer{
position:absolute;
bottom:80px;
left:50%;
transform:translateX(-50%);
text-align:center;
pointer-events:none;
z-index:0;
}

.container{
position:relative;
z-index:2;
}

#treeTrunk{
width:20px;
height:60px;
background:#5c3b1e;
margin:auto;
}

#treeLeaves{
font-size:40px;
}

/* CARDS */
.card{
background:rgba(0,0,0,.75);
padding:20px;
border-radius:15px;
max-width:600px;
margin:20px auto;
}

#letter{display:none;}

/* INPUTS */
input,textarea{
font-size:16px;
border-radius:10px;
padding:10px;
width:80%;
}

button{
padding:12px 25px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#ff4d6d,#ffd700);
font-weight:bold;
cursor:pointer;
margin:10px;
}

/* CHAT */
.msg{
padding:10px;
border-radius:12px;
margin:8px;
max-width:70%;
}

.me{
background:white;
color:black;
margin-left:auto;
}

.her{
background:#ff4d6d;
}
</style>
</head>

<body>

<div id="treeContainer">
<div id="treeTrunk"></div>
<div id="treeLeaves"></div>
</div>

<div id="entrance">
<h1>Welcome ❤️</h1>
<button onclick="enterSite()">Enter</button>
</div>

<div class="container">

<h1>Happy Birthday ❤️</h1>

<button onclick="toggleLetter()">Read My Letter</button>

<div id="letter" class="card">
<p id="letterText"></p>
</div>

<div id="japanClock" class="card"></div>
<div id="timeMessage" class="card"></div>
<div id="dailyMessage" class="card"></div>
<div id="loveCounter" class="card"></div>

<h2>💌 Send Me a Message</h2>

<input id="nameInput" placeholder="Your name">
<br><br>

<textarea id="msgInput" placeholder="Write something for me..."></textarea>
<br>

<button onclick="sendMessage()">Send ❤️</button>

<div id="messages" class="card"></div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, addDoc, collection, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from './firebase-config.js';

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* NAME SYSTEM */
const nameInput = document.getElementById("nameInput");
let savedName = localStorage.getItem("name");

if(savedName){
  nameInput.value = savedName;
  nameInput.disabled = true;
  nameInput.style.opacity = "0.6";
}

/* First-time save */
nameInput.addEventListener("change", () => {
  if(nameInput.value.trim() !== ""){
    localStorage.setItem("name", nameInput.value);
    nameInput.disabled = true;
    nameInput.style.opacity = "0.6";
  }
});

/* SEND */
window.sendMessage = async function(){
let text = msgInput.value;
let name = localStorage.getItem("name") || "Anonymous";

if(!text.trim()) return;

await addDoc(collection(db,"messages"),{
name:name,
message:text,
timestamp:serverTimestamp()
});

msgInput.value="";
};

/* RECEIVE (FIXED) */
const box=document.getElementById("messages");

onSnapshot(collection(db,"messages"), snap=>{
box.innerHTML="";
let arr=[];
snap.forEach(doc=>arr.push(doc.data()));

arr.sort((a,b)=>(a.timestamp?.seconds||0)-(b.timestamp?.seconds||0));

arr.forEach(d=>{
let myNames=["tomiwa","tomi","adelusi"];
let herNames=["tammy","tamilore"];

let isMe=myNames.some(n=>(d.name||"").toLowerCase().includes(n));
let isHer=herNames.some(n=>(d.name||"").toLowerCase().includes(n));

box.innerHTML+=`
<div class="msg ${isMe?'me':isHer?'her':''}">
<strong>${d.name}</strong><br>
${d.message}
</div>`;
});

box.scrollTop=box.scrollHeight;
});
</script>

<script>

/* JAPAN TIME */
function getJapanDate(){
return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Tokyo"}));
}

/* CLOCK */
function updateClock(){
let time=new Date().toLocaleTimeString("en-US",{timeZone:"Asia/Tokyo"});
japanClock.innerText="Osaka Time 🇯🇵: "+time;
}
setInterval(updateClock,1000);
updateClock();

/* ENTER */
function enterSite(){
let p=prompt("Password");
if(p!=="black"){alert("Wrong");return;}
document.getElementById("entrance").remove();
}

/* LETTER */
let msg=`Happy Birthday.

It’s crazy to think we met at school and two years ago we found love.

Even with the break we had, we still found our way back.

I love your personality, your stubborn but sweet nature, and your smile.

You are my moon 🌙❤️`;

function toggleLetter(){
let l=document.getElementById("letter");
l.style.display=l.style.display==="block"?"none":"block";
letterText.innerText=msg;
}

/* TIME MESSAGE */
let japan=getJapanDate();
let hour=japan.getHours();

let greeting=hour<12?"☀️ Good morning babe":
hour<18?"🌤 Good afternoon babe":
"🌙 Good night babe";

timeMessage.innerText=greeting;

/* DAILY */
const messages=[
"You are my moon 🌙","I love you more every day ❤️",
"You make life better","Thinking about you ❤️"
];

dailyMessage.innerText=messages[japan.getDate()%messages.length];

/* LOVE */
let startDate=new Date("2024-08-26");
let diff=Math.floor((japan-startDate)/(1000*60*60*24));
loveCounter.innerText="Day "+diff+" ❤️";

/* TREE */
let months=(japan.getFullYear()-startDate.getFullYear())*12+
(japan.getMonth()-startDate.getMonth());

let leaves=document.getElementById("treeLeaves");

if(months<1) leaves.innerHTML="🌱";
else if(months<3) leaves.innerHTML="🌿";
else if(months<6) leaves.innerHTML="🌸🌸";
else leaves.innerHTML="🌸🌸🌸🌸";

</script>

</body>
</html>
