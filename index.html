<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamilore ❤️</title>

<style>
body{
margin:0;
font-family:Segoe UI,Arial;
text-align:center;
color:white;
background:linear-gradient(to top,#2b1055,#7597de,#ffb6c1);
overflow-x:hidden;
}

/* Sakura */
.sakura{
position:fixed;
top:-10px;
width:8px;
height:8px;
background:pink;
border-radius:50%;
opacity:0.7;
animation:fall linear infinite;
z-index:1;
}
@keyframes fall{
to{transform:translateY(100vh);}
}

/* Entrance */
#entrance{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("torii.jpg") center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

/* Tree */
#treeContainer{
position:absolute;
bottom:80px;
left:50%;
transform:translateX(-50%) scale(0.8);
pointer-events:none;
z-index:0;
transition:1s;
}

/* Layout */
.container{
position:relative;
z-index:2;
}

.card{
background:rgba(0,0,0,.75);
padding:20px;
border-radius:15px;
max-width:650px;
margin:20px auto;
}

/* Chat */
#messages{
max-height:300px;
overflow-y:auto;
text-align:left;
}

.msg{
padding:10px 14px;
border-radius:20px;
margin:8px;
max-width:70%;
}

.me{
background:white;
color:black;
margin-left:auto;
}

.her{
background:#ff4d6d;
}

/* Inputs */
input,textarea{
border:none;
border-radius:10px;
padding:10px;
width:80%;
font-size:16px;
}

button{
padding:12px 25px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#ff4d6d,#ffd700);
font-weight:bold;
cursor:pointer;
margin:10px;
}
</style>
</head>

<body>

<div id="treeContainer">
<div id="treeLeaves" style="font-size:50px;">🌱</div>
</div>

<div id="entrance">
<h1>Welcome ❤️</h1>
<button onclick="enterSite()">Enter</button>
</div>

<div class="container">

<h1>Happy Birthday ❤️</h1>

<input id="nameInput" placeholder="Your name">
<br><br>

<textarea id="msgInput" placeholder="Write something..."></textarea>
<br>

<button onclick="sendMessage()">Send ❤️</button>

<div id="messages" class="card"></div>

</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, addDoc, collection, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from './firebase-config.js';

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* SEND */
window.sendMessage = async function(){
let text=document.getElementById("msgInput").value;
let name=document.getElementById("nameInput").value || "Anonymous";

if(text.trim()==="") return;

await addDoc(collection(db,"messages"),{
name:name,
message:text,
timestamp:serverTimestamp()
});

document.getElementById("msgInput").value="";
};

/* RECEIVE (FIXED) */
const box=document.getElementById("messages");

onSnapshot(collection(db,"messages"), (snapshot)=>{
box.innerHTML="";

let msgs=[];

snapshot.forEach(doc=>{
msgs.push(doc.data());
});

/* FIX SORT */
msgs.sort((a,b)=>{
return (a.timestamp?.seconds||0)-(b.timestamp?.seconds||0);
});

msgs.forEach(data=>{
let myNames=["tomiwa","tomi","adelusi"];
let isMe=myNames.some(n=>(data.name||"").toLowerCase().includes(n));

box.innerHTML+=`
<div class="msg ${isMe?'me':'her'}">
<strong>${data.name||"Anon"}</strong><br>
${data.message}
</div>`;
});

box.scrollTop=box.scrollHeight;
});
</script>

<script>

/* Sakura */
function petal(){
let p=document.createElement("div");
p.className="sakura";
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(Math.random()*3+2)+"s";
document.body.appendChild(p);
setTimeout(()=>p.remove(),5000);
}
setInterval(petal,300);

/* Enter */
function enterSite(){
let p=prompt("Password");
if(p!=="black"){alert("Wrong");return;}
document.getElementById("entrance").remove();
}

/* Tree growth */
let japan=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Tokyo"}));
let start=new Date("2024-08-26");

let months=(japan.getFullYear()-start.getFullYear())*12+
(japan.getMonth()-start.getMonth());

let tree=document.getElementById("treeContainer");
tree.style.transform=`translateX(-50%) scale(${0.8+months*0.05})`;

let leaves=document.getElementById("treeLeaves");
if(months<1) leaves.innerHTML="🌱";
else if(months<3) leaves.innerHTML="🌿";
else if(months<6) leaves.innerHTML="🌸🌸";
else leaves.innerHTML="🌸🌸🌸🌸";

</script>

</body>
</html>
