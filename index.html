<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamilore ❤️</title>

<style>
body{
margin:0;
font-family:Segoe UI,Arial;
text-align:center;
color:white;
background:linear-gradient(to top,#2b1055,#7597de,#ffb6c1);
overflow-x:hidden;
}

/* Sakura */
.sakura{
position:fixed;
top:-10px;
width:8px;
height:8px;
background:pink;
border-radius:50%;
animation:fall linear infinite;
}
@keyframes fall{to{transform:translateY(100vh);}}

/* Layout */
.container{position:relative;z-index:2;}

.card{
background:rgba(0,0,0,.75);
padding:20px;
border-radius:15px;
max-width:650px;
margin:20px auto;
}

/* Chat */
#messages{max-height:300px;overflow-y:auto;text-align:left;}
.msg{padding:10px;border-radius:15px;margin:8px;max-width:70%;}
.me{background:white;color:black;margin-left:auto;}
.her{background:#ff4d6d;}

input,textarea{
border:none;border-radius:10px;padding:10px;width:80%;font-size:16px;
}

button{
padding:10px 20px;border:none;border-radius:10px;
background:#ff4d6d;color:white;margin:5px;
}

/* Gallery */
.gallery img{
width:100px;
margin:5px;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Happy Birthday ❤️</h1>

<!-- Letter -->
<button onclick="toggleLetter()">Read My Letter</button>
<div id="letter" class="card" style="display:none;">
<p id="letterText"></p>
</div>

<!-- Messages -->
<h2>💌 Send Me a Message</h2>

<input id="nameInput" placeholder="Your name">
<br><br>

<textarea id="msgInput" placeholder="Write something..."></textarea><br>

<button onclick="sendMessage()">Send ❤️</button>
<button onclick="startRecording()">🎤 Voice</button>

<div id="messages" class="card"></div>

<!-- Gallery -->
<h2>📸 Memories</h2>
<div class="gallery">
<img src="pic1.jpg">
<img src="pic2.jpg">
<img src="pic3.jpg">
</div>

</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, addDoc, collection, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from './firebase-config.js';

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* AUTO SAVE NAME */
const nameInput=document.getElementById("nameInput");
nameInput.value=localStorage.getItem("name")||"";
nameInput.addEventListener("input",()=>{
localStorage.setItem("name",nameInput.value);
});

/* SEND */
window.sendMessage=async function(){
let text=msgInput.value;
let name=nameInput.value||"Anonymous";
if(!text.trim())return;

await addDoc(collection(db,"messages"),{
name,message:text,timestamp:serverTimestamp()
});

msgInput.value="";
};

/* RECEIVE */
onSnapshot(collection(db,"messages"),snap=>{
messages.innerHTML="";
let arr=[];
snap.forEach(doc=>arr.push(doc.data()));

arr.sort((a,b)=>(a.timestamp?.seconds||0)-(b.timestamp?.seconds||0));

arr.forEach(d=>{
let isMe=(d.name||"").toLowerCase().includes("tomi");
messages.innerHTML+=`
<div class="msg ${isMe?'me':'her'}">
<strong>${d.name}</strong><br>${d.message}
</div>`;
});
});
</script>

<script>

/* Letter */
let msg=`Happy Birthday ❤️
I love you so much.`;

function toggleLetter(){
letter.style.display=letter.style.display==="block"?"none":"block";
letterText.innerText=msg;
}

/* Sakura */
setInterval(()=>{
let p=document.createElement("div");
p.className="sakura";
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(Math.random()*3+2)+"s";
document.body.appendChild(p);
setTimeout(()=>p.remove(),5000);
},300);

/* 🎤 Voice Recording */
let mediaRecorder;
let chunks=[];

async function startRecording(){
let stream=await navigator.mediaDevices.getUserMedia({audio:true});
mediaRecorder=new MediaRecorder(stream);

mediaRecorder.start();
chunks=[];

mediaRecorder.ondataavailable=e=>chunks.push(e.data);

mediaRecorder.onstop=async ()=>{
let blob=new Blob(chunks);
let audioURL=URL.createObjectURL(blob);

await addDoc(collection(db,"messages"),{
name:nameInput.value||"Voice",
message:`<audio controls src="${audioURL}"></audio>`,
timestamp:new Date()
});
};

setTimeout(()=>mediaRecorder.stop(),5000); // 5 sec recording
}
</script>

</body>
</html>
